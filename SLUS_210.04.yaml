name: Def Jam - Fight for NY (USA) SLUS-21004
sha1: d42e26abaf966ad4862b3d0f96846d4cabd838f1
options:
  basename: SLUS_210.04
  target_path: SLUS_210.04.rom
  elf_path: build/SLUS_210.04.elf
  base_path: .
  platform: ps2
  compiler: EEGCC

  gp_value: 0x00405370
  ld_gp_expression: cod_SDATA_START + 0x7FF0

  # asm_path: asm
  # src_path: src
  # build_path: build

  ld_script_path: SLUS_210.04.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  create_asm_dependencies: True
  make_full_disasm_for_code: True

  find_file_boundaries: True

  o_as_suffix: True

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  section_order:
    - .text
    - .data
    - .rodata
    - .gcc_except_table
    - .sdata
    - .sbss
    - .bss

  auto_link_sections:
    - .data
    - .rodata
    - .gcc_except_table
    - .sdata
    - .sbss
    - .bss

segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0xE6FB4
    subalign: null
    subsegments:
      - [0x000000, c, cod/000000] # .text
      - [0x26EB00, data, cod/26EB00] # .data
      - [0x2AAE00, rodata, cod/2AAE00] # .rodata
      - [0x2FD280, gcc_except_table, cod/2FD280] # .gcc_except_table
      - [0x2FD380, sdata, cod/2FD380] # .sdata
      - { type: sbss, vram: 0x003FD500, name: cod/003FD500 } # .sbss
      - { type: bss, vram: 0x003FD800, name: cod/003FD800 } # .bss
  - [0x2FD48C]
